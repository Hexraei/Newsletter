name: Run Scrapers

on:
  schedule:
    - cron: '30 18 * * 0,3' # RSS + general + research — Monday/Thursday 00:00 IST
  workflow_dispatch:         # Manual trigger from Actions tab

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

jobs:
  migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed sources
        run: python scrapers/seed_sources.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-rss:
    name: RSS Feeds
    needs: migrate
    if: github.event.schedule == '30 18 * * 0,3' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install python-dotenv feedparser beautifulsoup4 aiohttp fake-useragent

      - name: Run RSS scrapers
        id: run_rss
        continue-on-error: true
        run: python scrapers/run_rss.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Scrape summary
        if: always()
        run: |
          echo "=== RSS Scraper Summary ==="
          echo "RSS scrapers outcome: ${{ steps.run_rss.outcome }}"
          if [ "${{ steps.run_rss.outcome }}" = "failure" ]; then
            echo "::warning::RSS scrapers failed"
          fi

  scrape-general:
    name: General Scrapers
    needs: migrate
    if: github.event.schedule == '30 18 * * 0,3' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install python-dotenv feedparser beautifulsoup4 aiohttp fake-useragent

      - name: Run general scrapers
        id: run_general
        continue-on-error: true
        run: python scrapers/run_general.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Scrape summary
        if: always()
        run: |
          echo "=== General Scraper Summary ==="
          echo "General scrapers outcome: ${{ steps.run_general.outcome }}"
          if [ "${{ steps.run_general.outcome }}" = "failure" ]; then
            echo "::warning::General scrapers failed"
          fi

  scrape-research:
    name: Research Papers
    needs: migrate
    if: github.event.schedule == '30 18 * * 0,3' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install python-dotenv feedparser beautifulsoup4 aiohttp fake-useragent

      - name: Run research scrapers
        id: run_research
        continue-on-error: true
        run: python scrapers/run_research.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Scrape summary
        if: always()
        run: |
          echo "=== Research Scraper Summary ==="
          echo "Research scrapers outcome: ${{ steps.run_research.outcome }}"
          if [ "${{ steps.run_research.outcome }}" = "failure" ]; then
            echo "::warning::Research scrapers failed"
          fi

  backfill-images:
    name: Backfill Article Images
    needs: [scrape-rss, scrape-general]
    if: always() && (needs.scrape-rss.result == 'success' || needs.scrape-general.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install httpx python-dotenv

      - name: Backfill images (OG scrape + Unsplash fallback)
        id: backfill
        continue-on-error: true
        run: python scrapers/fetch_images.py --limit 200 --batch-size 50
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Backfill summary
        if: always()
        run: |
          echo "=== Image Backfill Summary ==="
          echo "Backfill outcome: ${{ steps.backfill.outcome }}"
          if [ "${{ steps.backfill.outcome }}" = "failure" ]; then
            echo "::warning::Image backfill failed"
          fi

  summary:
    name: Scrape Summary
    needs: [scrape-rss, scrape-general, backfill-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          echo "=== Workflow Summary ==="
          echo "RSS: ${{ needs.scrape-rss.result }}"
          echo "General: ${{ needs.scrape-general.result }}"
          echo "Images: ${{ needs.backfill-images.result }}"
          if [ "${{ needs.scrape-rss.result }}" = "failure" ] && [ "${{ needs.scrape-general.result }}" = "failure" ]; then
            echo "::error::All scrapers failed!"
            exit 1
          fi
