name: Run Scrapers

on:
  schedule:
    - cron: '0 */6 * * *'   # RSS + general scrapers — every 6 hours
    - cron: '0 2 * * *'     # Research papers — daily at 2 AM UTC
  workflow_dispatch:         # Manual trigger from Actions tab

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

jobs:
  migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  scrape-rss:
    name: RSS Feeds
    needs: migrate
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install python-dotenv feedparser beautifulsoup4 aiohttp fake-useragent

      - name: Run RSS scrapers
        run: python scrapers/run_rss.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  scrape-general:
    name: General Scrapers
    needs: migrate
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install python-dotenv feedparser beautifulsoup4 aiohttp fake-useragent

      - name: Run general scrapers
        run: python scrapers/run_general.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  scrape-research:
    name: Research Papers
    needs: migrate
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install python-dotenv feedparser beautifulsoup4 aiohttp fake-useragent

      - name: Run research scrapers
        run: python scrapers/run_research.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
