name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsletter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt flake8
      - name: Tests (no expected-failure masking)
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://postgres:postgres@localhost:5432/newsletter_test' || 'sqlite+aiosqlite:///:memory:' }}
          SECRET_KEY: newsletter-ci-secret-key
          JWT_SECRET_KEY: newsletter-ci-jwt-secret-key
          DEBUG: 'false'
        run: python -m pytest tests/ -v --tb=short
      - name: Fatal Python lint and compilation
        run: |
          flake8 backend/app scrapers --select=E9,F63,F7,F82 --show-source --statistics
          python -m compileall -q backend/app scrapers
      - name: JavaScript syntax
        run: |
          for script in frontend/*.js; do node --check "$script"; done
      - name: Fresh PostgreSQL migrations
        if: matrix.database == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/newsletter_test
          SECRET_KEY: newsletter-ci-secret-key
          JWT_SECRET_KEY: newsletter-ci-jwt-secret-key
          DEBUG: 'false'
        run: alembic upgrade head
